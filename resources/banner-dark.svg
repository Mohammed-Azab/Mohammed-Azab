<svg xmlns="http://www.w3.org/2000/svg" width="900" height="482" viewBox="0 0 900 482" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
  <style>
    .p, .o { opacity: 0; }
    /* Commands stay present but are revealed by the animated clipping mask. */
    .t { opacity: 1; clip-path: inset(0 100% 0 0); }
    .last-prompt { opacity: 0; animation: show-last-prompt 8s linear infinite; }
    .c { opacity: 1; visibility: hidden; animation: cursor 8s linear infinite, blink 1s steps(1) infinite; }

    @keyframes show-p1 { 0%, 1.25% { opacity: 0; } 2.5%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show-p2 { 0%, 16.875% { opacity: 0; } 18.125%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show-p3 { 0%, 54.375% { opacity: 0; } 55.625%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show-p4 { 0%, 75% { opacity: 0; } 76.25%, 99.9% { opacity: 1; } 100% { opacity: 0; } }

    @keyframes show-o1 { 0%, 11.25% { opacity: 0; } 12.5%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show-o2 { 0%, 30.625% { opacity: 0; } 31.875%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show-o3 { 0%, 33.75% { opacity: 0; } 35%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show-o4 { 0%, 36.875% { opacity: 0; } 38.125%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show-o5 { 0%, 40% { opacity: 0; } 41.25%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show-o6 { 0%, 43.125% { opacity: 0; } 44.375%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show-o7 { 0%, 46.25% { opacity: 0; } 47.5%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show-o8 { 0%, 64.375% { opacity: 0; } 65.625%, 99.9% { opacity: 1; } 100% { opacity: 0; } }

    @keyframes type-t1 { 0%, 2.5% { clip-path: inset(0 100% 0 0); } 8.75%, 99.9% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes type-t2 { 0%, 18.75% { clip-path: inset(0 100% 0 0); } 29.375%, 99.9% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes type-t3 { 0%, 56.25% { clip-path: inset(0 100% 0 0); } 63.125%, 99.9% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes type-t4 { 0%, 76.875% { clip-path: inset(0 100% 0 0); } 85%, 99.9% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes show-last-prompt { 0%, 86.25% { opacity: 0; } 87.5%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes cursor { 0%, 86.25% { visibility: hidden; } 87.5%, 99.9% { visibility: visible; } 100% { visibility: hidden; } }

    .p1 { animation: show-p1 8s linear infinite; }
    .p2 { animation: show-p2 8s linear infinite; }
    .p3 { animation: show-p3 8s linear infinite; }
    .p4 { animation: show-p4 8s linear infinite; }
    .o1 { animation: show-o1 8s linear infinite; }
    .o2 { animation: show-o2 8s linear infinite; }
    .o3 { animation: show-o3 8s linear infinite; }
    .o4 { animation: show-o4 8s linear infinite; }
    .o5 { animation: show-o5 8s linear infinite; }
    .o6 { animation: show-o6 8s linear infinite; }
    .o7 { animation: show-o7 8s linear infinite; }
    .o8 { animation: show-o8 8s linear infinite; }
    .t1 { animation: type-t1 8s linear infinite; }
    .t2 { animation: type-t2 8s linear infinite; }
    .t3 { animation: type-t3 8s linear infinite; }
    .t4 { animation: type-t4 8s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p, .o, .c, .last-prompt { opacity: 1; visibility: visible; animation: none; }
      .t { opacity: 1; clip-path: none; animation: none; }
    }
  </style>
  <rect width="900" height="482" rx="14" fill="#0d1117"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/>
  <rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="26" cy="20" r="7" fill="#ff5f57"/><circle cx="50" cy="20" r="7" fill="#febc2e"/><circle cx="74" cy="20" r="7" fill="#28c840"/>
  <text x="450" y="26" text-anchor="middle" font-size="14" fill="#8b949e">azab@munich: ~</text>
  <text x="40" y="92" class="p p1" fill="#3fb950">❯</text>
  <text x="62" y="92" class="t t1" fill="#e6edf3" xml:space="preserve"><tspan fill="#e6edf3">whoami</tspan></text>
  <text x="40" y="122" class="o o1" fill="#5c85ff" font-weight="700" xml:space="preserve">Mohammed Azab</text>
  <text x="40" y="152" class="p p2" fill="#3fb950">❯</text>
  <text x="62" y="152" class="t t2" fill="#e6edf3" xml:space="preserve"><tspan fill="#e6edf3">git diff 2025..HEAD -- career.yml degree.yml</tspan></text>
  <text x="40" y="182" class="o o2" fill="#39c5cf" xml:space="preserve">@@ career.yml @@</text>
  <text x="40" y="212" class="o o3" fill="#f85149" xml:space="preserve">- role:   Software Engineer (ADAS/AD) @ CARIAD</text>
  <text x="40" y="242" class="o o4" fill="#3fb950" xml:space="preserve">+ role:   AI Engineer @ Dassault Systèmes</text>
  <text x="40" y="272" class="o o5" fill="#39c5cf" xml:space="preserve">@@ degree.yml @@</text>
  <text x="40" y="302" class="o o6" fill="#f85149" xml:space="preserve">- degree: B.Sc. Mechatronics Engineering</text>
  <text x="40" y="332" class="o o7" fill="#3fb950" xml:space="preserve">+ degree: M.Sc. Computational Science and Engineering, TUM</text>
  <text x="40" y="362" class="p p3" fill="#3fb950">❯</text>
  <text x="62" y="362" class="t t3" fill="#e6edf3" xml:space="preserve"><tspan fill="#e6edf3">pdftotext cv.pdf - | grep -i focus</tspan></text>
  <text x="40" y="392" class="o o8" fill="#ff7b72" font-weight="700" xml:space="preserve"><tspan fill="#ff7b72">Focus</tspan><tspan fill="#e6edf3">: autonomous driving, reinforcement learning, MPC</tspan></text>
  <text x="40" y="422" class="p p4" fill="#3fb950">❯</text>
  <text x="62" y="422" class="t t4" fill="#e6edf3" xml:space="preserve"><tspan fill="#e6edf3">open </tspan><tspan fill="#5c85ff" text-decoration="underline">https://mohammedazab.com</tspan><tspan fill="#8b949e">   # my portfolio</tspan></text>
  <text x="40" y="452" class="last-prompt" fill="#3fb950">❯ <tspan class="c" fill="#e6edf3">▌</tspan></text>
</svg>
